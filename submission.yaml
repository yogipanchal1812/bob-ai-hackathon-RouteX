submission:
  title: "ChainGuard AI"

  problem_statement: >
    Supply chain managers face operational uncertainty when disruptions like severe weather, port congestion, or corridor closures hit active transit networks without unified real-time visibility. Identifying affected shipments and quantifying financial exposure is slow and complex, making rapid rerouting and fleet reallocation difficult.

  solution_summary: >
    ChainGuard AI is an intelligent disruption assistant and fleet utilization optimizer that correlates disruption data against active shipment schedules, calculates multi-factor deterministic risk scores, provides an AI Copilot for operational queries, and delivers structured rerouting recommendations to protect delivery SLAs.

  key_features:
    - "Disruption Impact Analysis: Correlates active corridor disruptions against transit routes to quantify delivery delays and financial exposure"
    - "Deterministic Risk Engine: Evaluates operational risk scores (0-100) across severity, route exposure, cargo value, and carrier reliability"
    - "AI Copilot & Decision Support: Answers natural language queries grounded in live network context with IBM Bob integration"
    - "Actionable Operational Recommendations: Generates structured rerouting and expediting decisions with explainable confidence scoring"
    - "What-If Scenario Simulation: Simulates duration and severity parameter deltas to evaluate contingency routing strategies"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "React", "Vite"]
    ibm_technologies: ["watsonx.ai", "IBM Bob"]
    databases: ["In-Memory Data Store"]
    other: ["Docker", "GitHub Actions", "Recharts", "Pytest"]

  what_we_are_most_proud_of: >
    We are most proud of designing ChainGuard AI to bridge data analytics with automated AI-assisted decision support. Rather than presenting static alerts, our platform translates complex disruption events into immediate, actionable rerouting and fleet reallocation decisions with explainable confidence and strict anti-hallucination guardrails.

  known_limitations: >
    The current release utilizes curated demonstration datasets for global trade corridors rather than live IoT/telematics streaming feeds. Real-time carrier telematics and automated TMS write-back integrations are planned for future production phases.

